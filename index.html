<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>초중종 로마자 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one shared tablet per 4-person group. A role strip says whose turn it is, the word card and syllable slots sit in the middle, one big keypad for the current part below. Single light look, chosen on purpose to match the printed worksheet. */
:root {
  color-scheme: light;
  --paper: #f7f3ff;
  --card: #ffffff;
  --ink: #2b2540;
  --muted: #5b5670;
  --line: #ddd2f7;
  --purple: #6d3fd1;
  --purple-deep: #4c2a99;
  --purple-tint: #efe8ff;
  --sun: #f3d98a;
  --sun-tint: #fff6d6;
  --amber: #a14a06;
  --pink: #d6336c;
  --cho: #2563eb;  --cho-tint: #e3edff;
  --jung: #c64f0a; --jung-tint: #ffeedd;
  --jong: #0b8a63; --jong-tint: #dcf5ea;
  --judge: #6d3fd1; --judge-tint: #efe8ff;
  --bad: #c2263c;  --bad-tint: #ffe4e8;
  --display: 'Jua', 'Noto Sans KR', system-ui, sans-serif;
  --body: 'Noto Sans KR', system-ui, sans-serif;
  --latin: 'Nunito', 'Noto Sans KR', system-ui, sans-serif;
  --r: 16px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.5; padding-inline: 16px; padding-block: 14px 40px; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--purple); outline-offset: 2px; }
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ribbon { background: var(--pink); color: #fff; font-family: var(--display); font-size: 15px; padding: 4px 14px; border-radius: 999px; white-space: nowrap; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(24px, 4vw, 32px); color: var(--purple); line-height: 1.15; text-wrap: balance; }
.ghost { background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 8px 16px; font-weight: 700; color: var(--purple-deep); min-height: 44px; }
.ghost:hover { border-color: var(--purple); }

.tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tab { background: var(--card); border: 2px solid var(--line); border-radius: var(--r); padding: 10px 8px; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.tab b { white-space: nowrap; font-family: var(--display); font-weight: 400; font-size: 19px; color: var(--purple-deep); }
.tab span { font-size: 13px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--purple); border-color: var(--purple); }
.tab[aria-selected="true"] b, .tab[aria-selected="true"] span { color: #fff; }

.stage { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.pad { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }

/* status bar */
.status { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.status .left { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill.strong { border-color: var(--purple); color: var(--purple-deep); background: var(--purple-tint); }
.score { font-family: var(--display); font-size: 22px; color: var(--amber); }

/* role strip */
.roles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.role { border: 2.5px solid var(--line); border-radius: 14px; padding: 6px 8px; text-align: center; background: #fff; opacity: .55; transition: opacity .2s, transform .2s; }
.role small { display: block; font-size: 12px; font-weight: 700; }
.role b { display: block; font-family: var(--display); font-weight: 400; font-size: 20px; line-height: 1.2; overflow-wrap: anywhere; }
.role.c { border-color: var(--cho); } .role.c small { color: var(--cho); }
.role.v { border-color: var(--jung); } .role.v small { color: var(--jung); }
.role.f { border-color: var(--jong); } .role.f small { color: var(--jong); }
.role.j { border-color: var(--judge); } .role.j small { color: var(--judge); }
.role.on { opacity: 1; transform: translateY(-2px); }
.role.on.c { background: var(--cho-tint); } .role.on.v { background: var(--jung-tint); } .role.on.f { background: var(--jong-tint); } .role.on.j { background: var(--judge-tint); }

.turn { border-radius: var(--r); padding: 12px 16px; text-align: center; font-family: var(--display); font-size: clamp(22px, 4vw, 28px); color: #fff; line-height: 1.3; }
.turn.c { background: var(--cho); } .turn.v { background: var(--jung); } .turn.f { background: var(--jong); } .turn.j { background: var(--judge); }
.turn small { display: block; font-family: var(--body); font-size: 15px; font-weight: 500; opacity: .95; }

/* word card */
.question { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; background: var(--sun-tint); border: 2px solid var(--sun); border-radius: var(--r); padding: 14px 18px; }
.q-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.q-tag { align-self: flex-start; font-size: 13px; font-weight: 700; color: var(--amber); background: #fff; border: 1.5px solid var(--sun); padding: 1px 10px; border-radius: 999px; }
.q-word { font-family: var(--display); font-size: clamp(40px, 7vw, 60px); line-height: 1.1; }
.q-roman { font-family: var(--latin); font-weight: 900; font-size: clamp(38px, 7vw, 60px); line-height: 1.1; overflow-wrap: anywhere; }
.q-note { font-size: 15px; color: var(--muted); }
.q-note b { color: var(--ink); }

/* slots */
.slots { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: stretch; }
.slot { width: 132px; border: 2.5px dashed var(--line); border-radius: var(--r); padding: 10px 8px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; background: #fff; }
.slot.cur { border-style: solid; border-color: var(--purple); box-shadow: 0 0 0 4px var(--purple-tint); }
.slot.ok { border-style: solid; border-color: var(--jong); background: #f3fbf7; }
.slot.wrong { border-style: solid; border-color: var(--bad); background: var(--bad-tint); animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.syl { font-family: var(--display); font-size: 54px; line-height: 1; height: 58px; display: flex; align-items: center; }
.syl.empty { color: var(--line); }
.syl.target { color: var(--purple-deep); }
.parts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; width: 100%; }
.part { border: 2px solid; border-radius: 9px; text-align: center; padding: 2px 0 3px; min-height: 50px; display: flex; flex-direction: column; justify-content: center; background: #fff; }
button.part { cursor: pointer; }
button.part:hover { outline: 3px solid var(--bad); }
.part small { font-size: 11px; font-weight: 700; line-height: 1.1; }
.part .solo { font-weight: 800; font-size: 17px; line-height: 1.25; }
.part .solo.lat { font-family: var(--latin); font-weight: 900; }
.part .j { font-weight: 700; font-size: 15px; line-height: 1.2; }
.part .r { font-family: var(--latin); font-weight: 900; font-size: 15px; line-height: 1.15; }
.part.cho { border-color: var(--cho); background: var(--cho-tint); } .part.cho small { color: var(--cho); }
.part.jung { border-color: var(--jung); background: var(--jung-tint); } .part.jung small { color: var(--jung); }
.part.jong { border-color: var(--jong); background: var(--jong-tint); } .part.jong small { color: var(--jong); }
.part.blank { background: #fff; opacity: .55; }
.part.miss { outline: 3px solid var(--bad); outline-offset: 1px; background: var(--bad-tint); }

.built { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 4px 12px; text-align: center; }
.built-label { font-size: 14px; font-weight: 700; color: var(--muted); }
.built-out { font-family: var(--latin); font-weight: 900; font-size: clamp(30px, 6vw, 44px); line-height: 1.15; min-height: 1.15em; overflow-wrap: anywhere; }
.built-out .c { color: var(--cho); } .built-out .v { color: var(--jung); } .built-out .f { color: var(--jong); } .built-out .cursor { color: var(--line); }
.built-out.ko { font-family: var(--display); font-weight: 400; }

.feedback { min-height: 28px; text-align: center; font-weight: 700; font-size: 17px; color: var(--muted); }
.feedback.good { color: var(--jong); } .feedback.bad { color: var(--bad); }

/* keypad */
.pad-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.steps { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.step { font-family: var(--display); font-size: 17px; padding: 4px 12px; border-radius: 999px; border: 2px solid var(--line); color: var(--muted); background: #fff; }
.step.on.cho { background: var(--cho); border-color: var(--cho); color: #fff; }
.step.on.jung { background: var(--jung); border-color: var(--jung); color: #fff; }
.step.on.jong { background: var(--jong); border-color: var(--jong); color: #fff; }
.arrow { color: var(--muted); font-weight: 700; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tool { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 6px 14px; font-weight: 700; min-height: 44px; color: var(--purple-deep); }
.pad-hint { margin: 0; font-size: 15px; color: var(--muted); }
.pad-hint b { color: var(--ink); }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 8px; }
.key { border: 2px solid; border-radius: 14px; min-height: 66px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; transition: transform .08s; }
.key:active { transform: scale(.94); }
.key .big { font-weight: 700; font-size: 24px; line-height: 1.1; }
.key .big.latin { font-family: var(--latin); font-weight: 900; font-size: 26px; }
.key .sm { font-family: var(--latin); font-weight: 800; font-size: 15px; line-height: 1.2; }
.key .silent { font-family: var(--body); font-size: 12px; font-weight: 700; }
.key.cho { border-color: var(--cho); } .key.cho .big.latin, .key.cho .sm { color: var(--cho); } .key.cho:hover { background: var(--cho-tint); }
.key.jung { border-color: var(--jung); } .key.jung .big.latin, .key.jung .sm { color: var(--jung); } .key.jung:hover { background: var(--jung-tint); }
.key.jong { border-color: var(--jong); } .key.jong .big.latin, .key.jong .sm { color: var(--jong); } .key.jong:hover { background: var(--jong-tint); }

/* buttons, forms, results */
.primary { background: var(--purple); color: #fff; border: 0; border-radius: 999px; padding: 12px 28px; font-family: var(--display); font-size: 22px; min-height: 56px; }
.primary:hover { background: var(--purple-deep); }
.primary.green { background: var(--jong); } .primary.green:hover { background: #086b4d; }
.secondary { background: #fff; color: var(--purple-deep); border: 2.5px solid var(--purple); border-radius: 999px; padding: 10px 24px; font-family: var(--display); font-size: 20px; min-height: 56px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.center { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.big-title { font-family: var(--display); font-size: clamp(28px, 5vw, 40px); color: var(--purple); margin: 0; line-height: 1.2; text-wrap: balance; }
.lead { margin: 0; font-size: 17px; color: var(--muted); max-width: 60ch; }
.lead b { color: var(--ink); }
.names { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; width: 100%; }
.name-field { display: flex; flex-direction: column; gap: 4px; text-align: left; }
.name-field label { font-weight: 700; font-size: 14px; }
.name-field input { border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 18px; min-height: 52px; background: #fff; color: var(--ink); }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; width: 100%; text-align: left; }
.how div { border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 15px; }
.how b { display: block; font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--purple-deep); }
.cover { background: var(--ink); color: #fff; border-radius: 22px; padding: 36px 18px; }
.cover .big-title { color: #fff; }
.cover .lead { color: #e9e4ff; }
.cover .lead b { color: #fff; }
.result-roman { font-family: var(--latin); font-weight: 900; font-size: clamp(40px, 8vw, 64px); color: var(--purple); line-height: 1.1; overflow-wrap: anywhere; }
.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; width: 100%; }
.compare > div { border: 2.5px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.compare .ok { border-color: var(--jong); background: #f3fbf7; }
.compare .no { border-color: var(--bad); background: var(--bad-tint); }
.compare small { font-weight: 700; color: var(--muted); }
.compare .v { font-family: var(--latin); font-weight: 900; font-size: 30px; overflow-wrap: anywhere; }
.compare .v.ko { font-family: var(--display); font-weight: 400; }
.compare .v.strike { text-decoration: line-through; text-decoration-thickness: 3px; text-decoration-color: var(--bad); color: var(--muted); font-size: 24px; }
.answer { margin-top: 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: #1d4ed8; color: #fff; border-radius: 16px; padding: 8px 22px 10px; box-shadow: 0 4px 0 #1e3a8a; }
.answer-label { font-family: var(--display); font-size: 16px; letter-spacing: .1em; color: #dbe7ff; }
.answer-v { font-family: var(--latin); font-weight: 900; font-size: clamp(36px, 6vw, 48px); line-height: 1.1; overflow-wrap: anywhere; }
.answer-v.ko { font-family: var(--display); font-weight: 400; }
.summary { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.sum-row { border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sum-row .k { font-family: var(--display); font-size: 20px; }
.sum-row .e { font-family: var(--latin); font-weight: 800; color: var(--purple-deep); overflow-wrap: anywhere; }
.sum-row .s { color: var(--amber); font-family: var(--display); white-space: nowrap; }

/* hint sidebar */
.side { position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 90vw); background: var(--card); border-left: 2px solid var(--line); box-shadow: -10px 0 30px rgba(43, 37, 64, .14); padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; transform: translateX(105%); transition: transform .25s ease; z-index: 20; display: flex; flex-direction: column; gap: 14px; }
.side.open { transform: none; }
.side-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.side h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; color: var(--purple); }
.side h3 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 19px; }
.side .rule { margin: 0; font-size: 14px; color: var(--muted); }
.side section { padding: 8px; border-radius: 14px; border: 2px solid transparent; }
.side section.now { border-color: var(--purple); background: var(--purple-tint); }
.side-tab { position: fixed; right: 0; top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; background: var(--purple); color: #fff; border: 0; border-radius: 14px 0 0 14px; padding: 18px 10px; font-family: var(--display); font-size: 20px; letter-spacing: .15em; z-index: 19; min-width: 44px; box-shadow: -4px 0 14px rgba(43, 37, 64, .18); }
.tbl { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
.tbl.fin { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
.cell { border: 2px solid; border-radius: 10px; text-align: center; padding: 4px 2px; }
.cell b { display: block; font-size: 18px; }
.cell span { font-family: var(--latin); font-weight: 900; font-size: 16px; }
.cell.cho { border-color: var(--cho); background: var(--cho-tint); } .cell.cho span { color: var(--cho); }
.cell.jung { border-color: var(--jung); background: var(--jung-tint); } .cell.jung span { color: var(--jung); }
.cell.jong { border-color: var(--jong); background: var(--jong-tint); } .cell.jong span { color: var(--jong); }

.modal { position: fixed; inset: 0; background: rgba(43, 37, 64, .45); display: flex; align-items: flex-start; justify-content: center; padding: 24px 16px; overflow-y: auto; z-index: 30; }
.sheet { background: var(--card); border-radius: 22px; width: 100%; max-width: 720px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--purple); }
.sheet .rule { margin: 0; font-size: 14px; color: var(--muted); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.qr-row { display: flex; flex-wrap: wrap; gap: 8px; }
.qr-row input { flex: 1 1 260px; min-width: 0; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; min-height: 48px; background: #fff; color: var(--ink); }
#qrBox { align-self: center; background: #fff; padding: 16px; border-radius: 16px; border: 2px solid var(--line); }
#qrBox:empty { display: none; }
#qrBox img, #qrBox canvas { display: block; width: min(320px, 70vw); height: auto; }
footer { text-align: center; font-size: 13px; color: var(--muted); }
footer button { background: none; border: 0; color: var(--purple-deep); font-weight: 700; text-decoration: underline; padding: 8px; min-height: 44px; }

@media (max-width: 560px) {
  .slot { width: 112px; }
  .syl { font-size: 46px; height: 50px; }
  .tab span { display: none; }
  .roles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="ribbon">활동 3 · 모둠 게임</span><h1>초중종 로마자 게임</h1></div>
    <button class="ghost" id="openTable" type="button" aria-controls="side" aria-expanded="false">힌트 보기</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="게임 고르기">
        <button class="tab" role="tab" data-mode="mission" aria-selected="true" type="button"><b>암호 미션</b><span>2명 대 2명 · 쓰고 풀기</span></button>
    <button class="tab" role="tab" data-mode="free" aria-selected="false" type="button"><b>자유 만들기</b><span>내 이름, 우리 동네</span></button>
  </nav>

  <main class="stage" id="stage"></main>
  <section class="pad" id="pad" aria-label="자판" hidden></section>

  <footer>태블릿 한 대를 모둠이 함께 써요. <button type="button" id="openQr">선생님용 QR 코드 만들기</button></footer>
</div>

<button class="side-tab" id="sideTab" type="button" aria-controls="side" aria-expanded="false">힌트</button>
<aside class="side" id="side" aria-labelledby="sideTitle" inert>
  <div class="side-head"><h2 id="sideTitle">힌트: 로마자 표기표</h2><button class="ghost" type="button" id="closeSide">닫기</button></div>
  <p class="rule">지금 고를 차례인 칸이 보라색으로 표시돼요.</p>
  <section id="hint-c"><h3>첫소리 자음 (초성)</h3><div class="tbl" id="tblCho"></div></section>
  <section id="hint-v"><h3>모음 (중성)</h3><div class="tbl" id="tblJung"></div></section>
  <section id="hint-f"><h3>받침소리 자음 (종성)</h3><div class="tbl fin" id="tblJong"></div></section>
  <p class="rule">ㅇ이 첫소리에 오면 소리가 없어서 쓰지 않아요. 받침 ㄹ 다음에 ㄹ이 오면 ll로 써요 (한라산 → Hallasan). 로마자는 소리 나는 대로 써요. 지명과 사람 이름은 첫 글자를 대문자로 써요.</p>
</aside>

<div class="modal" id="qrModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
    <div class="sheet-head"><h2 id="qrTitle">학생 접속용 QR 코드</h2><button class="ghost" type="button" data-close>닫기</button></div>
    <p class="rule">이 게임의 주소를 붙여 넣으면 QR 코드가 크게 나타나요.</p>
    <div class="qr-row" id="qrForm">
      <label for="qrUrl" class="rule" style="flex-basis:100%">게임 주소</label>
      <input id="qrUrl" type="url" placeholder="https://..." autocomplete="off">
      <button class="primary" type="button" id="qrGo" style="font-size:18px">QR 만들기</button>
    </div>
    <div id="qrBox"></div>
    <p class="rule" id="qrMsg"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
  // ---------- 한글·로마자 표 ----------
  const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const CHO_R = { 'ㄱ':'g','ㄲ':'kk','ㅋ':'k','ㄷ':'d','ㄸ':'tt','ㅌ':'t','ㅂ':'b','ㅃ':'pp','ㅍ':'p','ㅈ':'j','ㅉ':'jj','ㅊ':'ch','ㅅ':'s','ㅆ':'ss','ㅎ':'h','ㄴ':'n','ㅁ':'m','ㄹ':'r','ㅇ':'' };
  const JUNG_R = { 'ㅏ':'a','ㅓ':'eo','ㅗ':'o','ㅜ':'u','ㅡ':'eu','ㅣ':'i','ㅐ':'ae','ㅔ':'e','ㅚ':'oe','ㅟ':'wi','ㅑ':'ya','ㅕ':'yeo','ㅛ':'yo','ㅠ':'yu','ㅒ':'yae','ㅖ':'ye','ㅘ':'wa','ㅙ':'wae','ㅝ':'wo','ㅞ':'we','ㅢ':'ui' };
  const JONG_GROUPS = [
    { r: 'k', name: 'ㄱ받침소리', keys: ['ㄱ','ㅋ'] }, { r: 't', name: 'ㄷ받침소리', keys: ['ㄷ','ㅌ','ㅈ','ㅊ','ㅅ','ㅆ'] },
    { r: 'p', name: 'ㅂ받침소리', keys: ['ㅂ','ㅍ'] }, { r: 'n', name: '', keys: ['ㄴ'] }, { r: 'm', name: '', keys: ['ㅁ'] },
    { r: 'ng', name: '', keys: ['ㅇ'] }, { r: 'l', name: '', keys: ['ㄹ'] },
  ];
  const JONG_R = { '': '', 'ㄲ': 'k' };
  JONG_GROUPS.forEach(g => g.keys.forEach(k => { JONG_R[k] = g.r; }));
  const CHO_ORDER = ['ㄱ','ㄲ','ㅋ','ㄷ','ㄸ','ㅌ','ㅂ','ㅃ','ㅍ','ㅈ','ㅉ','ㅊ','ㅅ','ㅆ','ㅎ','ㄴ','ㅁ','ㄹ','ㅇ'];
  const JUNG_ORDER = ['ㅏ','ㅓ','ㅗ','ㅜ','ㅡ','ㅣ','ㅐ','ㅔ','ㅚ','ㅟ','ㅑ','ㅕ','ㅛ','ㅠ','ㅒ','ㅖ','ㅘ','ㅙ','ㅝ','ㅞ','ㅢ'];
  const PART_NAME = { c: '초성', v: '중성', f: '종성' };
  const PART_CLS = { c: 'cho', v: 'jung', f: 'jong' };

  const compose = (c, v, f) => String.fromCharCode(0xAC00 + (CHO.indexOf(c) * 21 + JUNG.indexOf(v)) * 28 + JONG.indexOf(f || ''));
  const decompose = (ch) => { const n = ch.charCodeAt(0) - 0xAC00; return { c: CHO[Math.floor(n / 588)], v: JUNG[Math.floor((n % 588) / 28)], f: JONG[n % 28] }; };
  const toTokens = (str) => [...str].map(ch => ch === ' ' ? { space: true } : decompose(ch));
  function romanParts(tokens) {
    return tokens.map((t, i) => {
      if (t.space) return { space: true };
      const prev = tokens[i - 1];
      let c = t.c ? CHO_R[t.c] : '';
      if (t.c === 'ㄹ' && prev && !prev.space && prev.f === 'ㄹ') c = 'l';
      return { c, v: t.v ? JUNG_R[t.v] : '', f: t.f ? (JONG_R[t.f] ?? '') : '' };
    });
  }
  function romanize(tokens, cap) {
    const words = []; let w = '';
    romanParts(tokens).forEach(p => { if (p.space) { words.push(w); w = ''; } else w += p.c + p.v + p.f; });
    words.push(w);
    return words.map(x => cap && x ? x[0].toUpperCase() + x.slice(1) : x).join(' ');
  }

  // ---------- 낱말 ----------
  // [쓰는 글자, 소리 나는 대로(다르면), 종류, 뜻 힌트]
  const RAW = [
    ['바다','','낱말','파도가 치는 넓은 물'], ['나무','','낱말','숲을 이루는 식물'], ['나비','','낱말','꽃을 찾아 날아다니는 곤충'],
    ['사자','','낱말','동물의 왕'], ['하마','','낱말','입이 아주 큰 물가 동물'], ['모자','','낱말','머리에 쓰는 것'],
    ['오이','','낱말','길쭉한 초록 채소'], ['두부','','낱말','콩으로 만든 하얀 음식'], ['고구마','','낱말','땅속에서 자라는 달콤한 뿌리'],
    ['거미','','낱말','거미줄을 치는 동물'], ['지도','','낱말','땅의 모습을 줄여 그린 그림'], ['기차','','낱말','철길 위를 달리는 탈것'],
    ['피아노','','낱말','건반을 누르는 악기'],     ['토끼','','낱말','귀가 긴 동물'], ['코끼리','','낱말','코가 긴 동물'], ['포도','','낱말','송이로 열리는 보라색 과일'],
    ['청주','','지명','충청북도의 도청이 있는 도시'], ['오창','','지명','우리 학교가 있는 동네'],         ['충북','','지명','충청북도를 줄인 말'],
    ['추석','','낱말','송편을 먹는 한가위'], ['한복','','낱말','우리나라의 전통 옷'], ['김치','','낱말','배추로 담그는 반찬'],
    ['비빔밥','','낱말','나물을 넣고 비벼 먹는 밥'], ['불고기','','낱말','양념한 고기 요리'], ['친구','','낱말','함께 노는 사람'],
    ['빵','','낱말','밀가루로 구운 음식'], ['꽃','','낱말','봄에 피어나는 것'], ['밥','','낱말','쌀로 지은 음식'],
    ['곰','','낱말','겨울잠을 자는 동물'], ['꿈','','낱말','잘 때 꾸는 것'], ['떡','','낱말','쌀로 만든 간식'],
            ['세종','','이름','한글을 만든 임금'], ['씨름','','낱말','샅바를 잡고 하는 전통 운동'],
    ['학교','','낱말','우리가 공부하는 곳'], ['연필','','낱말','글씨를 쓰는 도구'], ['찌개','','낱말','국물이 자작한 요리'],
    ['유리','','낱말','창문에 끼우는 투명한 것'], ['여우','','낱말','꼬리가 탐스러운 동물'], ['야구','','낱말','방망이로 공을 치는 운동'],
    ['별','','낱말','밤하늘에 반짝이는 것'],
    ['민화','','낱말','옛사람들이 그린 그림'], ['사과','','낱말','빨갛고 동그란 과일'],
    ['의자','','낱말','앉을 때 쓰는 가구'], ['원숭이','','낱말','나무를 잘 타는 동물'], ['왜가리','','낱말','다리가 긴 물새'],
    ['의사','','낱말','아픈 사람을 고쳐 주는 사람'], ['예절','','낱말','지켜야 할 바른 몸가짐'], ['귀','','낱말','소리를 듣는 몸의 부분'],
        ['윷놀이','윤노리','낱말','윷을 던지는 놀이'], ['한옥','하녹','낱말','우리나라의 전통 집'],
    ['참외','차뫼','낱말','노란 여름 과일'],
    ['충주','','지명','사과와 충주호로 유명한 도시'], ['제천','','지명','약초와 청풍호로 유명한 도시'],
    ['보은','','지명','속리산 법주사가 있는 고장'], ['옥천','','지명','시인 정지용의 고향'],
    ['영동','','지명','포도와 국악으로 유명한 고장'], ['증평','','지명','충북에서 가장 작은 군'],
    ['진천','','지명','농다리가 있는 고장'], ['괴산','','지명','산막이옛길이 있는 고장'],
    ['음성','','지명','품바 축제가 열리는 고장'], ['단양','','지명','도담삼봉이 있는 고장'],
    ['오송','','지명','KTX 오송역이 있는 동네'],
  ];
  const MID_V = ['ㅡ','ㅐ','ㅔ','ㅑ','ㅕ','ㅛ','ㅠ'];
  const HARD_V = ['ㅒ','ㅖ','ㅘ','ㅙ','ㅚ','ㅝ','ㅞ','ㅟ','ㅢ'];
  const WORDS = RAW.map(([w, p, cat, hint]) => {
    const pron = p || w;
    const tokens = toTokens(pron);
    const cap = cat !== '낱말';
    const soundDiff = !!p;
    const lv = (soundDiff || tokens.some(t => HARD_V.includes(t.v))) ? 4 : tokens.some(t => MID_V.includes(t.v)) ? 3 : tokens.some(t => t.f) ? 2 : 1;
    return { w, pron, cat, hint, tokens, cap, roman: romanize(tokens, cap), soundDiff, lv };
  });
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick1 = (f, used) => shuffle(WORDS.filter(x => f(x) && !used.has(x.w)))[0];
  // 모든 모둠이 같은 순서로 풀도록 고정 (쉬운 것 → 어려운 것)
  const MISSION_SETS = [['나비', '청주', '김치', '제천'], ['오이', '오창', '한복', '단양']];
  const missionList = (set) => MISSION_SETS[set].map(w => WORDS.find(x => x.w === w));
  // 미션 시간 재기
  const fmt = (ms) => { const s = Math.floor(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
  let clock = null;
  function startClock() { stopClock(); clock = setInterval(() => { const t = $('mTimer'); if (t && S.mission) t.textContent = fmt(Date.now() - S.mission.t0); }, 250); }
  function stopClock() { if (clock) clearInterval(clock); clock = null; }

  // ---------- 글자 만들기(공통) ----------
  const emptySlot = () => ({ c: null, v: null, f: null });
  const newBuilder = (n) => ({ slots: Array.from({ length: n }, emptySlot), cur: 0, step: 'c' });
  function nextEmpty(B) {
    for (let i = 0; i < B.slots.length; i++) for (const k of ['c', 'v', 'f']) if (B.slots[i][k] === null) { B.cur = i; B.step = k; return true; }
    B.cur = B.slots.length; B.step = null; return false;
  }
  function undoPart(B) {
    const order = []; B.slots.forEach((s, i) => ['c', 'v', 'f'].forEach(k => order.push([i, k])));
    let pos = B.step ? order.findIndex(([i, k]) => i === B.cur && k === B.step) : order.length;
    for (let p = pos - 1; p >= 0; p--) { const [i, k] = order[p]; if (B.slots[i][k] !== null) { B.slots[i][k] = null; nextEmpty(B); return true; } }
    return false;
  }

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const S = { mode: 'mission', mission: null, free: null };

  // ---------- 화면 조각 ----------
  // show: 'roman' 로마자만, 'korean' 한글만, 'both' 둘 다
  function partHtml(kind, jamo, roman, show, o = {}) {
    const cls = PART_CLS[kind]; const label = { c: '초', v: '중', f: '종' }[kind];
    if (jamo === null || jamo === undefined) return `<div class="part ${cls} blank"><small>${label}</small><span class="j">&nbsp;</span></div>`;
    const j = jamo === '' ? '없음' : jamo;
    const r = roman === '' ? (jamo === '' ? '없음' : '소리X') : roman;
    const body = show === 'roman' ? `<span class="solo${roman ? ' lat' : ''}">${esc(r)}</span>`
      : show === 'korean' ? `<span class="solo">${esc(j)}</span>`
      : `<span class="j">${esc(j)}</span><span class="r">${esc(r === '없음' ? '–' : r)}</span>`;
    if (o.tap) return `<button type="button" class="part ${cls}${o.miss ? ' miss' : ''}" data-fix="${o.i}:${kind}" aria-label="${label}성 고치기">${`<small>${label}</small>`}${body}</button>`;
    return `<div class="part ${cls}${o.miss ? ' miss' : ''}"><small>${label}</small>${body}</div>`;
  }
  function slotsHtml(B, o) {
    const rp = romanParts(B.slots.map(s => ({ c: s.c, v: s.v, f: s.f })));
    return B.slots.map((s, i) => {
      let syl = s.c && s.v ? compose(s.c, s.v, s.f || '') : (s.c || '?');
      let empty = !s.c;
      if (o.target) { const t = o.target[i]; syl = compose(t.c, t.v, t.f); empty = false; }
      const cur = o.active && i === B.cur;
      const miss = (k) => o.wrong && o.wrong.some(([wi, wk]) => wi === i && wk === k);
      const anyMiss = o.wrong && o.wrong.some(([wi]) => wi === i);
      const cls = ['slot', cur ? 'cur' : '', anyMiss ? 'wrong' : '', o.allOk ? 'ok' : ''].join(' ');
      const p = (k) => partHtml(k, s[k], rp[i][k], o.show, { tap: o.tap && s[k] !== null, i, miss: miss(k) });
      return `<div class="${cls}"><div class="syl${empty ? ' empty' : ''}${o.target ? ' target' : ''}">${esc(syl)}</div><div class="parts">${p('c')}${p('v')}${p('f')}</div></div>`;
    }).join('');
  }
  function builtRoman(B, cap) {
    const rp = romanParts(B.slots.map(s => ({ c: s.c, v: s.v, f: s.f })));
    let out = ''; let first = true;
    rp.forEach((p, i) => {
      const s = B.slots[i];
      let c = s.c ? p.c : '', v = s.v ? p.v : '', f = s.f ? p.f : '';
      if (cap && first) { if (c) c = c[0].toUpperCase() + c.slice(1); else if (v) v = v[0].toUpperCase() + v.slice(1); }
      if (s.c) first = false;
      out += `<span class="c">${esc(c)}</span><span class="v">${esc(v)}</span><span class="f">${esc(f)}</span>`;
    });
    return out.replace(/<span class="[cvf]"><\/span>/g, '') ? out : '<span class="cursor">_</span>';
  }
  const romanOf = (B, cap) => romanize(B.slots.map(s => ({ c: s.c, v: s.v, f: s.f || '' })), cap);
  const koreanOf = (B) => B.slots.map(s => s.c && s.v ? compose(s.c, s.v, s.f || '') : (s.c || '')).join('');

  function keypadHtml(step, show, tools) {
    const silent = '<span class="silent">소리 없음</span>';
    const key = (cls, k, j, r) => {
      const lab = show === 'roman' ? (r ? `<span class="big latin">${esc(r)}</span>` : silent)
        : show === 'korean' ? `<span class="big">${j}</span>`
        : `<span class="big">${j}</span><span class="sm">${r ? esc(r) : silent}</span>`;
      const aria = show === 'roman' ? (r || '소리 없음') : show === 'korean' ? j : `${j} ${r || '소리 없음'}`;
      return `<button class="key ${cls}" type="button" data-k="${k}" data-v="${j}" aria-label="${aria}">${lab}</button>`;
    };
    let keys;
    if (step === 'c') keys = CHO_ORDER.map(j => key('cho', 'c', j, CHO_R[j])).join('');
    else if (step === 'v') keys = JUNG_ORDER.map(j => key('jung', 'v', j, JUNG_R[j])).join('');
    else if (show === 'roman') keys = JONG_GROUPS.map(g => `<button class="key jong" type="button" data-k="f" data-v="${g.keys[0]}" aria-label="받침 ${g.r}"><span class="big latin">${g.r}</span></button>`).join('');
    else keys = JONG_GROUPS.flatMap(g => g.keys).map(k => key('jong', 'f', k, JONG_R[k])).join('');
    if (step === 'f') keys += `<button class="key jong" type="button" data-k="f" data-v=""><span class="silent">받침 없음</span></button>`;
    const steps = ['c', 'v', 'f'].map((k, i) => `${i ? '<span class="arrow" aria-hidden="true">→</span>' : ''}<span class="step ${PART_CLS[k]}${step === k ? ' on' : ''}">${['① 초성', '② 중성', '③ 종성'][i]}</span>`).join('');
    const hint = { c: '<b>처음 소리(初聲)</b>: 글자의 맨 처음 자음', v: '<b>가운데 소리(中聲)</b>: 초성 다음에 나는 모음', f: '<b>끝소리(終聲)</b>: 받침. 없으면 「받침 없음」' }[step];
    return `<div class="pad-head"><div class="steps">${steps}</div><div class="tools">${tools || ''}</div></div><p class="pad-hint">${hint} · 막히면 오른쪽 <b>힌트</b>를 열어요.</p><div class="keys">${keys}</div>`;
  }
  function showPad(html) { const pad = $('pad'); pad.hidden = !html; pad.innerHTML = html || ''; markHint(); }
  let curStep = null;
  function markHint() { ['c', 'v', 'f'].forEach(k => $('hint-' + k).classList.toggle('now', curStep === k)); }

  // ================= 암호 미션 =================
  function missionSetup() {
    curStep = null;
    $('stage').innerHTML = `<div class="center">
      <p class="big-title">외국인 친구 암호 미션</p>
      <p class="lead">모둠을 <b>2명씩 가 팀, 나 팀</b>으로 나눠요. 한 팀은 몰래 본 낱말을 <b>로마자로만</b> 쓰고, 다른 팀은 그 로마자를 읽고 <b>한글 낱말</b>을 맞혀요. 정확히 써야 친구가 맞힐 수 있어요!</p>
      <div class="how">
        <div><b>① 출제팀</b>낱말을 몰래 보고 로마자로 바꿔요.</div>
        <div><b>② 해독팀</b>로마자만 보고 한글 글자를 만들어요.</div>
        <div><b>③ 확인</b>둘 다 맞으면 미션 성공! 한 문제마다 팀이 바뀌어요.</div>
      </div>
      <div id="missionForm" class="center" style="width:100%">
        <button class="primary" type="button" id="missionGo">미션 시작</button>
      </div></div>`;
    showPad('');
    const goMission = () => {
      const teams = ['가 팀', '나 팀'];
      S.mission = { teams, set: 0, list: missionList(0), idx: 0, ok: 0, log: [] };
      missionCover();
    };
    $('missionGo').addEventListener('click', goMission);
    $('missionForm').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); goMission(); } });
  }
  const writer = (M) => M.teams[M.idx % 2];
  const reader = (M) => M.teams[(M.idx + 1) % 2];
  function missionCover() {
    const M = S.mission; curStep = null;
    $('stage').innerHTML = `<div class="cover center">
      <p class="lead">미션 ${M.idx + 1} / ${M.list.length}</p>
      <p class="big-title">${esc(reader(M))}은(는) 화면을 보지 말아요!</p>
      <p class="lead"><b>${esc(writer(M))}</b>만 태블릿을 들고 낱말을 몰래 확인해요.</p>
      <button class="primary" type="button" id="mGo">출제팀 준비됐어요</button></div>`;
    showPad('');
    $('mGo').addEventListener('click', () => { M.B = newBuilder(M.list[M.idx].tokens.length); nextEmpty(M.B); M.phase = 'write'; M.t0 = Date.now(); startClock(); missionRender(); });
  }
  function missionRender() {
    const M = S.mission; const q = M.list[M.idx]; const B = M.B;
    curStep = B.step;
    const status = `<div class="status"><div class="left"><span class="pill strong">미션 ${M.idx + 1} / ${M.list.length}</span><span class="pill">성공 ${M.ok}</span></div><span class="score" aria-label="걸린 시간"><span id="mTimer">${fmt(Date.now() - M.t0)}</span></span></div>`;
    if (M.phase === 'write') {
      const done = !B.step;
      $('stage').innerHTML = `${status}<div class="turn c">출제팀 ${esc(writer(M))}<small>외국인 친구에게 알려 줄 낱말을 로마자로 바꿔요. 해독팀에게 보여 주지 마세요!</small></div>
        <div class="question"><div class="q-main"><span class="q-tag">${esc(q.cat)} · 쉿! 비밀 낱말</span><div class="q-word">${esc(q.w)}</div><div class="q-note">${esc(q.hint)}</div></div></div>
        <div class="slots">${slotsHtml(B, { target: q.tokens, show: 'roman', active: true })}</div>
        <div class="built"><span class="built-label">우리 팀이 쓴 로마자</span><span class="built-out">${builtRoman(B, q.cap)}</span></div>
        ${done ? '<div class="row"><button class="primary green" type="button" id="mPass">다 썼어요! 해독팀에게 넘기기</button></div>' : ''}`;
      const tools = '<button class="tool" type="button" id="undoBtn">← 지우기</button>';
      if (done) { showPad(`<div class="pad-head"><div class="tools">${tools}</div></div>`); $('mPass').addEventListener('click', missionPass); }
      else showPad(keypadHtml(B.step, 'roman', tools));
      $('undoBtn').addEventListener('click', () => { if (undoPart(B)) missionRender(); });
      return;
    }
    if (M.phase === 'read') {
      const R2 = M.R; const done = !R2.step;
      curStep = R2.step;
      $('stage').innerHTML = `${status}<div class="turn v">해독팀 ${esc(reader(M))}<small>출제팀이 쓴 로마자를 읽고, 어떤 우리말 낱말인지 한글 글자로 만들어요.</small></div>
        <div class="question"><div class="q-main"><span class="q-tag">${esc(q.cat)} · ${q.tokens.length}글자</span><div class="q-roman">${esc(M.written)}</div></div></div>
        <div class="slots">${slotsHtml(R2, { show: 'korean', active: true })}</div>
        <div class="built"><span class="built-label">우리 팀이 푼 낱말</span><span class="built-out ko">${esc(koreanOf(R2)) || '<span class="cursor">_</span>'}</span></div>
        ${done ? '<div class="row"><button class="primary green" type="button" id="mCheck">정답 확인!</button></div>' : ''}`;
      const tools = '<button class="tool" type="button" id="undoBtn">← 지우기</button>';
      if (done) { showPad(`<div class="pad-head"><div class="tools">${tools}</div></div>`); $('mCheck').addEventListener('click', missionCheck); }
      else showPad(keypadHtml(R2.step, 'korean', tools));
      $('undoBtn').addEventListener('click', () => { if (undoPart(R2)) missionRender(); });
    }
  }
  function missionPass() {
    const M = S.mission; const q = M.list[M.idx];
    M.written = romanOf(M.B, q.cap);
    curStep = null;
    $('stage').innerHTML = `<div class="cover center">
      <p class="big-title">태블릿을 ${esc(reader(M))}에게 넘겨요</p>
      <p class="lead">비밀 낱말은 가려졌어요. 해독팀은 로마자만 보고 풀어요. 시간은 계속 흘러가요!</p>
      <p class="big-title" id="mTimer">${fmt(Date.now() - M.t0)}</p>
      <button class="primary" type="button" id="mRead">해독 시작</button></div>`;
    showPad('');
    $('mRead').addEventListener('click', () => { M.R = newBuilder(q.tokens.length); nextEmpty(M.R); M.phase = 'read'; missionRender(); });
  }
  function missionCheck() {
    const M = S.mission; const q = M.list[M.idx];
    const writeOk = M.written.toLowerCase() === q.roman.toLowerCase();
    const answer = koreanOf(M.R);
    const readOk = answer === q.w;
    const success = writeOk && readOk;
    if (success) M.ok++;
    const took = Date.now() - M.t0; stopClock();
    M.log.push({ w: q.w, roman: q.roman, success, took });
    curStep = null;
    const msg = success ? '미션 성공! 두 팀 모두 잘했어요.'
      : !writeOk && readOk ? '해독팀이 맞혔지만, 출제팀 로마자에 고칠 곳이 있어요.'
      : !writeOk ? '출제팀 로마자가 정답과 달라서 풀기 어려웠어요. 정답 로마자를 같이 확인해요.'
      : '로마자는 정확했어요! 해독팀이 한 번 더 생각해 봐요.';
    $('stage').innerHTML = `<div class="center">
      <p class="big-title">${success ? '미션 성공!' : '아쉬워요!'}</p>
      <p class="lead">비밀 낱말은 <b style="font-size:1.4em">${esc(q.w)}</b> 이었어요. 걸린 시간 <b style="font-size:1.4em">${fmt(took)}</b></p>
      <div class="compare">
        <div class="${writeOk ? 'ok' : 'no'}"><small>출제팀(${esc(writer(M))})이 쓴 로마자</small><span class="v${writeOk ? '' : ' strike'}">${esc(M.written)}</span>${writeOk ? '<small>정답이에요!</small>' : `<div class="answer"><span class="answer-label">정답</span><span class="answer-v">${esc(q.roman)}</span></div>`}</div>
        <div class="${readOk ? 'ok' : 'no'}"><small>해독팀(${esc(reader(M))})이 푼 낱말</small><span class="v ko${readOk ? '' : ' strike'}">${esc(answer)}</span>${readOk ? '<small>정답이에요!</small>' : `<div class="answer"><span class="answer-label">정답</span><span class="answer-v ko">${esc(q.w)}</span></div>`}</div>
      </div>
      <div class="feedback ${success ? 'good' : 'bad'}">${msg}</div>
      <button class="primary" type="button" id="mNext">${M.idx + 1 >= M.list.length ? '결과 보기' : '다음 미션 (팀 바꾸기)'}</button></div>`;
    showPad('');
    $('mNext').addEventListener('click', () => { M.idx++; if (M.idx >= M.list.length) missionEnd(); else missionCover(); });
  }
  function missionEnd() {
    const M = S.mission;
    $('stage').innerHTML = `<div class="center">
      <p class="big-title">${M.set + 1}판 미션 끝!</p>
      <div class="result-roman">${M.ok} / ${M.list.length} 성공</div>
      <p class="lead">모두 걸린 시간 <b style="font-size:1.6em">${fmt(M.log.reduce((a, l) => a + l.took, 0))}</b></p>
      <p class="lead">성공 개수와 시간을 선생님께 알려 주세요.</p>
      <div class="summary">${M.log.map(l => `<div class="sum-row"><span class="k">${esc(l.w)}</span><span class="e">${esc(l.roman)}</span><span class="s">${l.success ? '성공' : '실패'} · ${fmt(l.took)}</span></div>`).join('')}</div>
      <div class="row"><button class="primary" type="button" id="mAgain">${M.set === 0 ? '2판 도전하기' : '1판 다시 하기'}</button><button class="secondary" type="button" id="toFree">우리 이름 만들어 보기</button></div></div>`;
    showPad('');
    $('mAgain').addEventListener('click', () => { const set = (M.set + 1) % MISSION_SETS.length; S.mission = { ...M, set, list: missionList(set), idx: 0, ok: 0, log: [] }; missionCover(); });
    $('toFree').addEventListener('click', () => setMode('free'));
  }

  // ================= 자유 만들기 =================
  function freeStart() {
    S.free = { B: { slots: [emptySlot()], cur: 0, step: 'c' }, spaces: new Set(), cap: true };
    freeRender();
  }
  function freeTokens(F) { const out = []; F.B.slots.forEach((s, i) => { if (F.spaces.has(i)) out.push({ space: true }); out.push({ c: s.c, v: s.v, f: s.f || '' }); }); return out; }
  function freeRender() {
    const F = S.free; const B = F.B; curStep = B.step;
    const complete = B.slots.filter(s => s.c && s.v && s.f !== null);
    const toks = []; complete.forEach((s, i) => { if (F.spaces.has(i)) toks.push({ space: true }); toks.push({ c: s.c, v: s.v, f: s.f || '' }); });
    $('stage').innerHTML = `<div class="question"><div class="q-main"><span class="q-tag">자유 만들기</span>
        <div class="q-note">친구 이름이나 우리 동네 이름을 로마자로 바꿔 보고, 친구들에게 보여 주며 발표해요. 사람 이름은 성 다음에 「띄어쓰기」를 눌러요.</div>
        <div class="q-note">성씨는 Kim, Lee, Park처럼 익숙한 표기를 쓰기도 해요.</div></div></div>
      <div class="slots">${slotsHtml(B, { show: 'both', active: true })}</div>
      <div class="built"><span class="built-label">로마자</span><span class="built-out">${esc(romanize(toks, F.cap)) || '<span class="cursor">_</span>'}</span></div>
      <div class="row"><label class="pill" for="capBox" style="display:flex;gap:8px;align-items:center;min-height:44px"><input type="checkbox" id="capBox" ${F.cap ? 'checked' : ''}> 첫 글자 대문자 (이름·지명)</label></div>`;
    $('capBox').addEventListener('change', (e) => { F.cap = e.target.checked; freeRender(); });
    const tools = `<button class="tool" type="button" id="spaceBtn">띄어쓰기</button><button class="tool" type="button" id="undoBtn">← 지우기</button><button class="tool" type="button" id="resetBtn">모두 지우기</button>`;
    showPad(keypadHtml(B.step, 'both', tools));
    $('undoBtn').addEventListener('click', () => {
      const s = B.slots[B.cur];
      if (B.step === 'c' && B.cur > 0) { B.slots.pop(); B.cur--; F.spaces.delete(B.cur + 1); B.slots[B.cur].f = null; B.step = 'f'; }
      else if (B.step === 'f') { s.v = null; B.step = 'v'; } else if (B.step === 'v') { s.c = null; B.step = 'c'; }
      freeRender();
    });
    $('resetBtn').addEventListener('click', freeStart);
    $('spaceBtn').addEventListener('click', () => { if (B.step === 'c' && B.cur > 0) { F.spaces.add(B.cur); freeRender(); } });
  }
  function freePick(k, v) {
    const B = S.free.B; if (k !== B.step) return;
    B.slots[B.cur][k] = v;
    if (k === 'c') B.step = 'v'; else if (k === 'v') B.step = 'f';
    else { B.slots.push(emptySlot()); B.cur++; B.step = 'c'; }
    freeRender();
  }

  // ---------- 모드 전환·이벤트 ----------
  function setMode(m) {
    S.mode = m;
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.mode === m)));
    stopClock();
    if (m === 'mission') missionSetup(); else freeStart();
    window.scrollTo({ top: 0 });
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));
  $('pad').addEventListener('click', (e) => {
    const b = e.target.closest('[data-k]'); if (!b) return;
    const k = b.dataset.k, v = b.dataset.v;
    if (S.mode === 'mission' && S.mission) {
      const M = S.mission; const B = M.phase === 'write' ? M.B : M.R;
      if (k !== B.step) return; B.slots[B.cur][k] = v; nextEmpty(B); missionRender();
    } else if (S.mode === 'free') freePick(k, v);
  });

  // hint sidebar
  $('tblCho').innerHTML = CHO_ORDER.filter(j => j !== 'ㅇ').map(j => `<div class="cell cho"><b>${j}</b><span>${CHO_R[j]}</span></div>`).join('');
  $('tblJung').innerHTML = JUNG_ORDER.map(j => `<div class="cell jung"><b>${j}, ${compose('ㅇ', j, '')}</b><span>${JUNG_R[j]}</span></div>`).join('');
  $('tblJong').innerHTML = JONG_GROUPS.map(g => `<div class="cell jong"><b>${g.keys.join(', ')}</b>${g.name ? `<div style="font-size:12px;color:var(--muted)">(${g.name})</div>` : ''}<span>${g.r}</span></div>`).join('');
  function setSide(open) {
    const side = $('side');
    side.classList.toggle('open', open); side.inert = !open; $('sideTab').hidden = open;
    ['sideTab', 'openTable'].forEach(id => $(id).setAttribute('aria-expanded', String(open)));
    if (open) { markHint(); const now = side.querySelector('section.now'); if (now) now.scrollIntoView({ block: 'nearest' }); $('closeSide').focus({ preventScroll: true }); }
  }
  $('openTable').addEventListener('click', () => setSide(!$('side').classList.contains('open')));
  $('sideTab').addEventListener('click', () => setSide(true));
  $('closeSide').addEventListener('click', () => { setSide(false); $('sideTab').focus({ preventScroll: true }); });

  // QR
  $('openQr').addEventListener('click', () => { $('qrModal').hidden = false; });
  $('qrModal').addEventListener('click', (e) => { if (e.target === $('qrModal') || e.target.closest('[data-close]')) $('qrModal').hidden = true; });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('qrModal').hidden = true; setSide(false); } });
  const goQr = () => {
    const url = $('qrUrl').value.trim(); const box = $('qrBox'); box.innerHTML = '';
    if (!/^https?:\/\//.test(url)) { $('qrMsg').textContent = 'https:// 로 시작하는 주소를 붙여 넣어 주세요.'; return; }
    if (typeof QRCode === 'undefined') { $('qrMsg').textContent = 'QR 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'; return; }
    new QRCode(box, { text: url, width: 640, height: 640, correctLevel: QRCode.CorrectLevel.M });
    $('qrMsg').textContent = '태블릿 카메라로 찍으면 바로 게임이 열려요.';
  };
  $('qrGo').addEventListener('click', goQr);
  $('qrUrl').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); goQr(); } });

  setMode('mission');
})();
</script>

</body>
</html>
